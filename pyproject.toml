[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-explorer"
version = "0.1.0"
description = "Photo Explorer application foundation"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
